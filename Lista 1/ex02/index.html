<!-- Exercício 2 — Formulário de cadastro
Elabore uma tela de cadastro de usuário.
Requisitos:
 Campos para nome, e-mail, senha, data de nascimento e cidade;
 Botões de enviar e limpar;
 Uso de label, input, select e validações HTML, como required e
type="email";
 Estilizar o formulário para melhorar a usabilidade. -->

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 02</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Cadastro de Usuário</h1>

    <form action="">
      <label for="name">Nome: </label>
      <input
        id="name"
        type="text"
        name="name"
        placeholder="Digite seu nome"
        required
      />

      <label for="email">Email: </label>
      <input
        id="email"
        type="email"
        name="email"
        placeholder="Digite seu e-mail"
        required
      />

      <label for="password">Senha: </label>
      <input
        id="password"
        type="password"
        name="password"
        placeholder="Digite sua senha"
        required
      />

      <label for="date">Data de Nascimento: </label>
      <input type="date" id="date" name="date" required />

      <label for="city">Cidade: </label>
      <select name="city" id="city" required>
        <option value="BH">Belo Horizonte</option>
        <option value="SP">São Paulo</option>
        <option value="RJ">Rio de Janeiro</option>
      </select>

      <button class="btn-submit" type="submit">Enviar</button>
      <button class="btn-clear" type="reset">Limpar</button>
    </form>
  </body>
</html>
