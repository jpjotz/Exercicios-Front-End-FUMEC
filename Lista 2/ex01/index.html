<!-- Exercício 1 — Card de produto responsivo
Desenvolva um card para exibir um produto de uma loja virtual.
Requisitos:
 Imagem, nome, descrição, preço e botão “Comprar”;
 Estilização com CSS;
 Efeito visual no botão ao passar o mouse (:hover);
 Layout centralizado e adaptável para telas menores. -->

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card de Produto</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToQbn0yVjO_4hiXFD04t7pmi0-R-5nWcE6PIuSrMQOdA&s=10" alt="Imagem do produto" />
      <div class="conteudo">
        <h1>Notebook</h1>
        <p class="descricao">
          Notebook ideal para estudos, trabalho e tarefas do dia a dia.
        </p>
        <p class="preco">R$ 3.500,00</p>
        <button>Comprar</button>
      </div>
    </div>
  </body>
</html>
