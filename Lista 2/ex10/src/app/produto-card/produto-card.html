<div class="card">

  <img [src]="produto.imagem" [alt]="produto.nome">

  <div class="conteudo">

    <h2>{{ produto.nome }}</h2>

    <p>{{ produto.descricao }}</p>

    <strong>R$ {{ produto.preco.toFixed(2) }}</strong>

    <button (click)="adicionarCarrinho()">
      Adicionar ao carrinho
    </button>

  </div>

</div>
